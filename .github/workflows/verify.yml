name: Build and authored Lua semantics

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.9'
      - run: python3 build.py
      - run: python3 tests/oracles.py build/oracles
      - run: python3 tests/verify.py --tools build/oracles/tools.json --output build/results
